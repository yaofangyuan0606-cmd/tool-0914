[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "h01kit"
version = "0.1.0"
description = "H01 连接组数据工具：取数 / 本地重绘 / 批量截图 / 范围边界探测"
requires-python = ">=3.9"
dependencies = [
  "numpy>=1.23",
  "pillow>=9.0",
  "cloud-volume>=8.0",
  "requests>=2.28",
  "tqdm>=4.64",
  # 必须锁 48.0.1：更高版本在 macOS + Python 3.13 上无预编译 wheel，
  # 会回退 Rust 源码编译并失败。详见 requirements.txt 注释。
  "cryptography==48.0.1",
]

[project.scripts]
h01 = "h01kit.cli:main"

[tool.setuptools]
packages = ["h01kit"]
